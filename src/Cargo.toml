[package]
name = "omarchy-srv"
version = "0.1.0"
edition = "2021"
description = "RAM-first agentic server OS components"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
inotify = "0.10"
nix = { version = "0.27", features = ["process", "signal", "fs"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["blocking", "json"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "omarchy-cgroupd"
path = "src/bin/omarchy-cgroupd.rs"

[[bin]]
name = "omarchy-configd"
path = "src/bin/omarchy-configd.rs"

[lib]
name = "omarchy_srv"
path = "src/lib.rs"
