name: Cargo lock bootstrap

on:
  push:
    branches:
      - "nixos/runtime-package"

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Emit lock for bootstrap
        run: |
          echo "SUBSTRATE_CARGO_LOCK_BEGIN"
          base64 -w0 Cargo.lock
          echo
          echo "SUBSTRATE_CARGO_LOCK_END"
