name: CI

on:
  push:
    branches: [main, "bootstrap/**", "ci/**", "hardening/**", "integration/**", "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust build, test, clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action implementation, pinned
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bash syntax
        run: |
          bash -n scripts/kv-demote-zram.sh
          bash -n tests/stress-zram-demotion.sh
      - name: TOML parse
        run: python3 ci/check_toml.py
      - name: Systemd static verification
        run: |
          mkdir -p /tmp/substrate-systemd
          sed 's#ExecStart=/usr/bin/omarchy-configd#ExecStart=/bin/true#' systemd/omarchy-configd.service > /tmp/substrate-systemd/omarchy-configd.service
          sed 's#ExecStart=/usr/bin/omarchy-cgroupd#ExecStart=/bin/true#' systemd/omarchy-cgroupd.service > /tmp/substrate-systemd/omarchy-cgroupd.service
          systemd-analyze verify /tmp/substrate-systemd/omarchy-configd.service
          systemd-analyze verify /tmp/substrate-systemd/omarchy-cgroupd.service
      - name: Repository policy checks
        run: python3 ci/check_repo.py
