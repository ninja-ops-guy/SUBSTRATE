name: SUBSTRATE Harness CI

on:
  push:
    paths:
      - 'harness/**'
      - '.github/workflows/harness-ci.yml'
  pull_request:
    paths:
      - 'harness/**'
      - '.github/workflows/harness-ci.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/*.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Unit tests
        run: pytest -q
      - name: Failure-injection dry run
        run: python src/failure_injection.py --dry-run --tests oom stall cgroup_write daemon_death
