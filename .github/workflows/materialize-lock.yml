name: Materialize Cargo Lock

on:
  push:
    branches: ["hardening/v0.1-qualification"]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Resolve exact dependency graph
        working-directory: src
        run: cargo generate-lockfile
      - name: Commit lockfile if absent or changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already exact"
            exit 0
          fi
          git commit -m "build: commit resolved Cargo.lock"
          git push origin HEAD:hardening/v0.1-qualification
